<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>창호 견적 관리</title><link rel="stylesheet" href="style.css"></head><body><div id="staffGate" class="staffGate"><div class="staffPanel"><small>프로젝트 1팀</small><h1>담당자를 선택해주세요</h1><p>선택한 담당자로 자동 로그인됩니다.</p><div id="staffChoices"></div></div></div><div class="app"><header><div><small>프로젝트 1팀</small><h1>창호 견적 관리</h1><div id="currentStaff" class="currentStaff"></div></div><div><b>V23</b><button id="changeStaff" class="smallBtn">담당자 변경</button></div></header><main>
<section id="home"><div class="hero"><small>ESTIMATE WORKSPACE</small><h2>현장 견적을<br>간편하게 관리하세요.</h2><p>창호 위치·제품·실측 치수를 입력하고 견적을 저장합니다.</p><button id="newBtn">+ 새 견적 작성</button></div><div class="heading"><div><small>RECENT ESTIMATES</small><h2>최근 견적</h2></div><span id="count">0건</span></div><div id="list"></div></section>
<section id="form" class="hidden"><button class="textBtn" id="backBtn">← 목록으로</button><small id="formEyebrow">NEW ESTIMATE</small><h2 id="formTitle">새 견적 작성</h2><form id="estimateForm"><div class="basic card"><label>현장명 *<input id="projectName" required maxlength="100" placeholder="예: ○○아파트 101동"></label><label>고객명<input id="customerName" maxlength="50"></label><label>고객 연락처<input id="customerPhone" maxlength="30" placeholder="010-0000-0000"></label><label>현장 주소<input id="address" maxlength="200"></label><label>견적 상태<select id="status"><option>작성중</option><option>견적완료</option><option>계약</option><option>취소</option></select></label><label>메모<textarea id="memo" rows="3"></textarea></label></div><h3>창호 항목</h3><div id="items"></div><button type="button" class="secondary add" id="addItem">＋ 창호 항목 추가</button><section class="extras card"><h3>부가시공비</h3><p class="muted">조건을 선택하면 자동 계산됩니다.</p><div class="dims"><label>평형대<select id="sizeBand"><option value="20">20평대</option><option value="30">30평대</option></select></label><label>기존 창호<select id="oldFrame"><option value="AL">AL창</option><option value="PL">PL창</option></select></label></div><label>장비 사용 여부<select id="equipment"><option value="가능">장비 가능 (400,000원)</option><option value="불가">장비 불가 (500,000원)</option></select></label><label>보양 기준<select id="protection"><option value="none">보양 없음</option><option value="1-2">1~2룸</option><option value="3-4">3~4룸</option><option value="5-7">5~7룸</option><option value="8-9">8~9룸</option><option value="10+">10룸 이상</option></select></label><div id="extraSummary" class="extraSummary"></div></section><div class="actions"><button type="button" class="secondary" id="cancelBtn">취소</button><button type="submit" id="saveBtn">견적 저장</button></div><p id="message"></p></form></section>
<section id="detail" class="hidden"><button class="backBtn" id="detailBackBtn">← 목록으로</button><h2 id="detailTitle"></h2><div class="detailActions"><button id="editBtn">견적 수정</button><button id="deleteBtn" class="danger">견적 삭제</button></div><div class="card detailInfo"><div class="infoGrid"><p>현장명<strong id="dProject"></strong></p><p>고객명<strong id="dCustomer"></strong></p><p>주소<strong id="dAddress"></strong></p><p>작성일<strong id="dDate"></strong></p><p>담당자<strong id="dStaff"></strong></p><p>상태<strong id="dStatus"></strong></p></div><div class="detailSection"><h3>창호 내역</h3><div id="dItems" class="detailTable"></div></div><div class="detailSection"><h3>부가시공비</h3><div id="dExtras" class="detailTable"></div></div><div class="detailSection"><h3>메모</h3><p id="dMemo" class="memoText">-</p></div><div class="detailTotal"><span>총 견적금액</span><strong id="dTotal">가격 미계산</strong></div></div><div class="quoteActions"><button id="internalBtn">내부용 상세 견적서</button><button id="customerBtn" class="secondary">고객용 견적서</button></div><div id="quote" class="quote hidden"></div></section>
</main><footer>프로젝트 1팀 · V23</footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
